<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>DSH Remote · 远程控制台</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<link rel="stylesheet" href="/static/login.css" />
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--a"></div>
  <div class="bg-glow bg-glow--b"></div>
  <div class="bg-noise"></div>
</div>

<main class="stage">
  <section class="card" aria-label="DSH Remote 登录">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="100%" height="100%">
          <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brandGrad)"/>
          <path d="M18 24c0-6.6 5.4-11 12.5-11H34c7.1 0 12.5 4.4 12.5 11s-5.4 11-12.5 11h-3.5c-7.1 0-12.5 4.4-12.5 11s5.4 11 12.5 11H34c7.1 0 12.5-4.4 12.5-11" fill="none" stroke="#f5f8ff" stroke-width="4" stroke-linecap="round"/>
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f8cff"/>
              <stop offset="1" stop-color="#7a5cff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="brand__title">DSH&nbsp;Remote</h1>
      <p class="brand__sub">远程控制 DeepSeek Harness</p>
    </div>

    <form id="loginForm" class="form" autocomplete="on" novalidate>
      <label class="field">
        <span class="field__label">访问口令</span>
        <span class="field__control">
          <input id="password" name="password" type="password" required
                 autocomplete="current-password" inputmode="text"
                 placeholder="••••••••••" autofocus />
          <button type="button" class="field__toggle" id="togglePwd" aria-label="显示口令" tabindex="-1">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>
      <button type="submit" class="submit" id="submitBtn">
        <span class="submit__text">连接</span>
        <span class="submit__spinner" hidden></span>
      </button>
      <p id="msg" class="msg" role="status" hidden></p>
    </form>

    <footer class="status">
      <span class="status__dot" id="statusDot"></span>
      <span class="status__text" id="statusText">正在检查连接…</span>
    </footer>
  </section>

  <p class="hint">在运行 <code>dsh web</code> 的电脑上部署本网关,<br/>手机即可全功能接管会话。</p>
</main>

<script src="/static/login.js"></script>
</body>
</html>
