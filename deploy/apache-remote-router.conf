# =====================================================================
# dsh-remote — Apache (httpd 2.4) reference config (tunnel mode)
#
# Production-tested setup: Ubuntu 24.04, Apache 2.4, relay-router listening
# on 127.0.0.1:13444 (systemd service), PWA served as static files.
# Counterpart of deploy/nginx-13443-remote-router.conf.
#
#   phone  -> https://relay.example.com/app/        static PWA (native.html)
#          -> /_login /_devices /remote/<id>/...    relay-router (HTTP)
#   bridge -> wss://relay.example.com/_bridge       relay-router (WebSocket)
#
# Replace before use:
#   relay.example.com        your relay hostname (DNS must point to this server)
#   /opt/dsh-relay/app       directory containing clients/dsh-web/native.html
#   127.0.0.1:13444          address of your relay-router
#   certificate paths        e.g. the ones certbot created
#
# Required modules:
#   a2enmod ssl proxy proxy_http proxy_wstunnel rewrite headers deflate alias
#
# Install:
#   cp this file to /etc/apache2/sites-available/relay.example.com.conf
#   a2ensite relay.example.com && apachectl configtest && systemctl reload apache2
# =====================================================================


# ---------------------------------------------------------------------
# Port 80: redirect everything to HTTPS
# (no port in the VirtualHost on purpose, see the NOTE below)
# ---------------------------------------------------------------------
<VirtualHost relay.example.com>
    ServerName relay.example.com
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =relay.example.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>


# ---------------------------------------------------------------------
# Port 443
#
# NOTE on <VirtualHost name:443>: Apache groups vhosts by address:port.
# "relay.example.com:443" resolves to <server-ip>:443, "*:443" is a
# DIFFERENT group. If your other vhosts use "*:443", use "*:443" here too,
# otherwise browsers can get the wrong vhost/certificate (the first vhost
# of the group wins as default). Keep the style consistent on your server.
# ---------------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost relay.example.com:443>
    ServerName relay.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/relay.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/relay.example.com/privkey.pem
    # created by certbot; drop this line if you don't use certbot
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ---- proxy basics -------------------------------------------------
    ProxyPreserveHost On
    # long-lived streams (SSE / WebSocket)
    ProxyTimeout 3600
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # ---- phone PWA: /app/ is the public URL, /login/ kept for compat ---
    RedirectMatch ^/app$ /app/

    Alias /app/   /opt/dsh-relay/app/
    Alias /login/ /opt/dsh-relay/app/
    <Directory "/opt/dsh-relay/app">
        Options None
        AllowOverride None
        Require all granted
        DirectoryIndex native.html
        Header set Cache-Control "no-cache"
        AddType application/manifest+json .webmanifest
    </Directory>

    # static paths must NOT be forwarded to the router (must precede ProxyPass /)
    ProxyPassMatch ^/(app|login)(/.*)?$ !

    RewriteEngine On

    # ---- self-hosted mode detection (important!) -----------------------
    # The PWA probes /relay-api/api/public-config: a JSON answer means
    # "SaaS cloud account mode", anything else means "self-hosted access key".
    # There is no account service here, so answer 410 Gone (non-JSON).
    # Without this the PWA shows the SaaS phone-number login.
    RewriteRule ^/relay-api(/.*)?$ - [G,L]

    # ---- WebSocket: /_bridge (laptop bridge) and /remote/<id>/... ------
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:13444/$1 [P,L]

    # ---- everything else -> relay-router -------------------------------
    # flushpackets=on: no buffering, keeps Server-Sent-Events realtime
    ProxyPass        / http://127.0.0.1:13444/ flushpackets=on timeout=3600
    ProxyPassReverse / http://127.0.0.1:13444/

    # ---- compression ---------------------------------------------------
    # Never compress text/event-stream (SSE would arrive in bursts) and
    # not E2EE payloads. Add more text types if you like, e.g.:
    #   AddOutputFilterByType DEFLATE text/css application/javascript text/javascript
    AddOutputFilterByType DEFLATE application/json application/manifest+json image/svg+xml

    # No CustomLog on purpose: Ubuntu's other_vhosts_access.log is used
    # (the fail2ban filter below expects that format).
</VirtualHost>
</IfModule>


# =====================================================================
# OPTIONAL 1 — catch-all default vhost (separate file, e.g. 000-catchall.conf)
#
# The first vhost of an address:port group answers requests whose Host
# header matches nothing (bare IP, unknown names, port scanners). Make that
# a locked-down vhost instead of a random site. Uses the snakeoil cert
# (apt install ssl-cert); browsers will show a certificate warning there.
#
#   <VirtualHost 203.0.113.10>
#       ServerName catchall.invalid
#       <Location />
#           Require all denied
#       </Location>
#   </VirtualHost>
#   <IfModule mod_ssl.c>
#   <VirtualHost 203.0.113.10:443>
#       ServerName catchall.invalid
#       SSLEngine on
#       SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
#       SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
#       <Location />
#           Require all denied
#       </Location>
#   </VirtualHost>
#   </IfModule>
#
# =====================================================================
# OPTIONAL 2 — fail2ban against access-key guessing on POST /_login
#
# /etc/fail2ban/filter.d/dsh-relay-login.conf
#   [Definition]
#   failregex = ^\S+:\d+ <HOST> \S+ \S+ \[[^\]]*\] "POST /_login[^"]*" 401
#   ignoreregex =
#   (fail2ban strips the timestamp before matching, hence "\[[^\]]*\]")
#
# /etc/fail2ban/jail.d/dsh-relay-login.conf
#   [dsh-relay-login]
#   enabled  = true
#   backend  = auto
#   filter   = dsh-relay-login
#   logpath  = /var/log/apache2/other_vhosts_access.log
#   port     = http,https
#   maxretry = 5
#   findtime = 10m
#   bantime  = 1h
#
# Test the filter:  fail2ban-regex <logfile> /etc/fail2ban/filter.d/dsh-relay-login.conf
# =====================================================================
