# =====================================================================
# dsh-remote — nginx 反向代理参考配置(隧道模式)
#
# 把下面 location 块并入你 443/自定义端口的 HTTPS server:
#   - /app/ /login/  静态 PWA(clients/dsh-web/native.html)
#   - /relay-api/    账号 API(仅 SaaS 模式需要,指向 relay-enterprise)
#   - /_devices /_quota /_login /remote/ /_bridge / → relay-router
#
# 需要先定义 map 变量:
#   map $http_upgrade $connection_upgrade {
#     default upgrade; '' close;
#   }
# 并把下面两处 <ROUTER_ADDR> 换成你的 router 地址(如 http://127.0.0.1:13444),
# 静态目录换成你的 PWA 目录。
# =====================================================================

        # ---- 手机端 PWA:/app/ 是对外地址,/login/ 保留兼容 ----
        location = /app {
            return 302 /app/;
        }
        location /app/ {
            alias <PWA_DIR>/;   # 你的静态 PWA 目录(仅 native.html)
            index native.html;
            add_header Cache-Control "no-cache";
            types {
                text/html html;
                application/javascript js mjs;
                text/css css;
                application/json json;
                image/svg+xml svg;
                application/manifest+json webmanifest;
            }
        }
        location /login/ {
            alias <PWA_DIR>/;   # 你的静态 PWA 目录(仅 native.html)
            index native.html;
            add_header Cache-Control "no-cache";
            types {
                text/html html;
                application/javascript js mjs;
                text/css css;
                application/json json;
                image/svg+xml svg;
                application/manifest+json webmanifest;
            }
        }

        # ---- 多设备路由:手机 HTTP/WS → relay-router(/remote/<deviceId>/<path>) ----
        location /remote/ {
            proxy_pass <ROUTER_ADDR>;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- bridge 注册通道:bridge 主动连 wss://你的域名/_bridge ----
        location /_bridge {
            proxy_pass <ROUTER_ADDR>;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- 根路径按 dsh_device cookie 交给 router(兼容 dsh web 绝对路径) ----
        location / {
            proxy_pass <ROUTER_ADDR>;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
